<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rắn Săn Mồi — Heino</title>
<link rel="stylesheet" href="../css/style.css">
<style>
  #board{
    background: var(--surface);
    border: 2px solid var(--line);
    border-radius: 14px;
    image-rendering: pixelated;
    touch-action: none;
    width: min(400px, 88vw);
    height: min(400px, 88vw);
    aspect-ratio: 1 / 1;
  }
  @media (max-width: 420px){
    .pad{ grid-template-columns: repeat(3, 44px); grid-template-rows: repeat(3, 44px); gap:6px; }
  }
  .pad{ display:grid; grid-template-columns: repeat(3, 48px); grid-template-rows: repeat(3, 48px); gap:8px; }
  .pad button{
    background: var(--surface); border:1px solid var(--line); border-radius:10px;
    color: var(--text); font-size:1.2rem; cursor:pointer;
  }
  .pad button:hover{ border-color: var(--coral); }
  .p-up{ grid-column:2; grid-row:1; }
  .p-left{ grid-column:1; grid-row:2; }
  .p-right{ grid-column:3; grid-row:2; }
  .p-down{ grid-column:2; grid-row:3; }
  .overlay{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    flex-direction: column; gap:14px;
    background: rgba(22,17,44,0.85); border-radius:14px; text-align:center; padding:20px;
  }
  .stage-box{ position:relative; }
  .hidden{ display:none; }
</style>
</head>
<body>
<div class="game-shell">
  <div class="game-top">
    <a href="../index.html" class="back-link">← Về Heino</a>
    <span class="game-title">🐍 Rắn Săn Mồi</span>
    <span></span>
  </div>

  <div class="game-stage">
    <div class="score-row">
      <span class="score-pill">Điểm: <strong id="score">0</strong></span>
      <span class="score-pill">Kỷ lục: <strong id="best">0</strong></span>
    </div>

    <div class="stage-box">
      <canvas id="board" width="400" height="400"></canvas>
      <div class="overlay" id="overlay">
        <h3 style="font-family:var(--font-display); margin:0; font-size:1.4rem;">Sẵn sàng chưa?</h3>
        <p class="game-hint">Dùng phím mũi tên / WASD hoặc nút điều hướng bên dưới để di chuyển.</p>
        <button class="btn btn-primary" id="startBtn">▶ Bắt đầu</button>
      </div>
    </div>

    <div class="pad" aria-hidden="true">
      <button class="p-up" data-dir="up">↑</button>
      <button class="p-left" data-dir="left">←</button>
      <button class="p-right" data-dir="right">→</button>
      <button class="p-down" data-dir="down">↓</button>
    </div>

    <p class="game-hint">Ăn 🍎 để lớn thêm và ghi điểm. Đâm tường hoặc tự cắn thân sẽ kết thúc ván chơi.</p>
  </div>
</div>

<script>
const canvas = document.getElementById('board');
const ctx = canvas.getContext('2d');
const cell = 20;
const cols = canvas.width / cell;
const rows = canvas.height / cell;

let snake, dir, nextDir, food, score, best, timer, running;
best = Number(sessionStorage.getItem('heino_snake_best') || 0);
document.getElementById('best').textContent = best;

function reset(){
  snake = [{x:8,y:10},{x:7,y:10},{x:6,y:10}];
  dir = {x:1,y:0};
  nextDir = {x:1,y:0};
  score = 0;
  document.getElementById('score').textContent = score;
  placeFood();
  running = true;
}

function placeFood(){
  do{
    food = { x: Math.floor(Math.random()*cols), y: Math.floor(Math.random()*rows) };
  } while(snake.some(s => s.x===food.x && s.y===food.y));
}

function tick(){
  if(!running) return;
  dir = nextDir;
  const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

  if(head.x < 0 || head.y < 0 || head.x >= cols || head.y >= rows || snake.some(s => s.x===head.x && s.y===head.y)){
    gameOver();
    return;
  }

  snake.unshift(head);
  if(head.x === food.x && head.y === food.y){
    score += 10;
    document.getElementById('score').textContent = score;
    placeFood();
  } else {
    snake.pop();
  }
  draw();
}

function draw(){
  ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--surface');
  ctx.fillRect(0,0,canvas.width, canvas.height);

  ctx.fillStyle = '#FF5D73';
  ctx.font = `${cell}px serif`;
  ctx.fillText('🍎', food.x*cell, food.y*cell + cell - 2);

  snake.forEach((s, i) => {
    ctx.fillStyle = i === 0 ? '#FFD23F' : '#3FE0B0';
    ctx.fillRect(s.x*cell+1, s.y*cell+1, cell-2, cell-2);
  });
}

function gameOver(){
  running = false;
  if(score > best){
    best = score;
    sessionStorage.setItem('heino_snake_best', best);
    document.getElementById('best').textContent = best;
  }
  const overlay = document.getElementById('overlay');
  overlay.classList.remove('hidden');
  overlay.innerHTML = `
    <h3 style="font-family:var(--font-display); margin:0; font-size:1.4rem;">Game Over 💀</h3>
    <p class="game-hint">Bạn được ${score} điểm.</p>
    <button class="btn btn-primary" id="startBtn">↻ Chơi lại</button>
  `;
  document.getElementById('startBtn').addEventListener('click', startGame);
}

function startGame(){
  document.getElementById('overlay').classList.add('hidden');
  reset();
  draw();
  clearInterval(timer);
  timer = setInterval(tick, 110);
}

document.getElementById('startBtn').addEventListener('click', startGame);

window.addEventListener('keydown', e => {
  const map = {
    ArrowUp:{x:0,y:-1}, w:{x:0,y:-1}, W:{x:0,y:-1},
    ArrowDown:{x:0,y:1}, s:{x:0,y:1}, S:{x:0,y:1},
    ArrowLeft:{x:-1,y:0}, a:{x:-1,y:0}, A:{x:-1,y:0},
    ArrowRight:{x:1,y:0}, d:{x:1,y:0}, D:{x:1,y:0},
  };
  const d = map[e.key];
  if(!d || !running) return;
  if(d.x === -dir.x && d.y === -dir.y) return;
  nextDir = d;
});

document.querySelectorAll('.pad button').forEach(btn => {
  btn.addEventListener('click', () => {
    const map = { up:{x:0,y:-1}, down:{x:0,y:1}, left:{x:-1,y:0}, right:{x:1,y:0} };
    const d = map[btn.dataset.dir];
    if(!running) return;
    if(d.x === -dir.x && d.y === -dir.y) return;
    nextDir = d;
  });
});

reset();
draw();
</script>
</body>
</html>
