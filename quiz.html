<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đố Vui Nhanh — Heino</title>
<link rel="stylesheet" href="../css/style.css">
<style>
  .quiz-card{
    width: 100%; max-width: 480px;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 18px; padding: 28px 24px;
  }
  .quiz-q{ font-family: var(--font-display); font-size: 1.25rem; margin: 0 0 20px; text-align:center; }
  .quiz-options{ display:flex; flex-direction: column; gap: 10px; }
  .quiz-opt{
    text-align:left; padding: 13px 16px; border-radius: 12px;
    background: var(--surface-2); border: 1px solid var(--line);
    cursor:pointer; font-size: 0.95rem; font-weight:600;
  }
  .quiz-opt:hover{ border-color: var(--sky); }
  .quiz-opt.correct{ background: #DCFCE7; border-color:#22C55E; }
  .quiz-opt.wrong{ background: #FEE2E2; border-color:#EF4444; }
  .progress-bar{ width:100%; height:8px; background: var(--surface-2); border-radius: 100px; overflow:hidden; margin-bottom: 18px; }
  .progress-fill{ height:100%; background: var(--sky); width:0%; transition: width .25s ease; }
</style>
</head>
<body>
<div class="game-shell">
  <div class="game-top">
    <a href="../index.html" class="back-link">← Về Heino</a>
    <span class="game-title">❓ Đố Vui Nhanh</span>
    <span></span>
  </div>

  <div class="game-stage">
    <div class="score-row">
      <span class="score-pill">Câu: <strong id="qNum">1</strong>/<strong id="qTotal">8</strong></span>
      <span class="score-pill">Điểm: <strong id="score">0</strong></span>
    </div>

    <div class="quiz-card">
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
      <div id="quizBody"></div>
    </div>
  </div>
</div>

<script>
const questions = [
  { q: 'Thủ đô của Việt Nam là gì?', options: ['TP. Hồ Chí Minh','Hà Nội','Đà Nẵng','Huế'], correct: 1 },
  { q: 'Hành tinh nào gần Mặt Trời nhất?', options: ['Sao Kim','Trái Đất','Sao Thủy','Sao Hoả'], correct: 2 },
  { q: '7 x 8 bằng bao nhiêu?', options: ['54','56','58','64'], correct: 1 },
  { q: 'Con vật nào được gọi là "chúa tể rừng xanh"?', options: ['Hổ','Voi','Sư tử','Gấu'], correct: 2 },
  { q: 'Đại dương nào lớn nhất thế giới?', options: ['Đại Tây Dương','Ấn Độ Dương','Bắc Băng Dương','Thái Bình Dương'], correct: 3 },
  { q: 'Ngôn ngữ lập trình nào dùng dấu ngoặc nhọn { } để tạo khối lệnh phổ biến nhất?', options: ['Python','JavaScript','HTML','CSS'], correct: 1 },
  { q: 'Một tuần có bao nhiêu ngày?', options: ['5','6','7','8'], correct: 2 },
  { q: 'Nước nào có diện tích lớn nhất thế giới?', options: ['Trung Quốc','Canada','Nga','Mỹ'], correct: 2 },
];

let current = 0, score = 0;
document.getElementById('qTotal').textContent = questions.length;

function renderQuestion(){
  const q = questions[current];
  document.getElementById('qNum').textContent = current + 1;
  document.getElementById('progressFill').style.width = `${(current/questions.length)*100}%`;

  const body = document.getElementById('quizBody');
  body.innerHTML = `
    <p class="quiz-q">${q.q}</p>
    <div class="quiz-options">
      ${q.options.map((opt, i) => `<button class="quiz-opt" data-i="${i}">${opt}</button>`).join('')}
    </div>
  `;
  body.querySelectorAll('.quiz-opt').forEach(btn => {
    btn.addEventListener('click', () => selectAnswer(Number(btn.dataset.i)));
  });
}

function selectAnswer(i){
  const q = questions[current];
  const buttons = document.querySelectorAll('.quiz-opt');
  buttons.forEach(b => b.style.pointerEvents = 'none');
  buttons[q.correct].classList.add('correct');
  if(i !== q.correct){
    buttons[i].classList.add('wrong');
  } else {
    score++;
    document.getElementById('score').textContent = score;
  }

  setTimeout(() => {
    current++;
    if(current < questions.length){
      renderQuestion();
    } else {
      finishQuiz();
    }
  }, 900);
}

function finishQuiz(){
  document.getElementById('progressFill').style.width = '100%';
  const body = document.getElementById('quizBody');
  body.innerHTML = `
    <p class="quiz-q">🎉 Hoàn thành!</p>
    <p style="text-align:center; color:var(--text-dim); margin-bottom:20px;">Bạn trả lời đúng ${score}/${questions.length} câu.</p>
    <button class="btn btn-primary" style="width:100%; justify-content:center;" id="retryBtn">↻ Chơi lại</button>
  `;
  document.getElementById('retryBtn').addEventListener('click', () => {
    current = 0; score = 0;
    document.getElementById('score').textContent = 0;
    renderQuestion();
  });
}

renderQuestion();
</script>
</body>
</html>
